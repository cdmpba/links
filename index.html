<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ministerio Público · Enlaces oficiales</title>
<meta name="description" content="Accesos oficiales del Ministerio Público de la Provincia de Buenos Aires: sitio institucional, mapa de dependencias, acompañamiento a la víctima y capacitación.">
<meta name="theme-color" content="#013D70">
<link rel="icon" type="image/png" href="favicon-mpba.png">
<link rel="apple-touch-icon" href="favicon-mpba.png">
<meta property="og:title" content="Ministerio Público · Provincia de Buenos Aires">
<meta property="og:description" content="Accesos oficiales del MPBA en un solo lugar.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#013D70; --accent:#78C2FF; --onacc:#013D70; --acc2:color-mix(in srgb,#78C2FF 80%,#013D70); --ink:#f3f6ff; --ink2:rgba(235,240,255,.74); --ink3:rgba(235,240,255,.5);
  --line:rgba(255,255,255,.10); --card:rgba(255,255,255,.055); --card-h:rgba(255,255,255,.09);
  --c1:#013D70; --c2:#5FAC5E; --c3:#EC184F; --c4:#78C2FF; --on:#fff; --cd:color-mix(in srgb,var(--c) 62%,#000);
  --r:22px; --fh:Sora,system-ui,sans-serif; --fb:Figtree,system-ui,sans-serif;
  --blob:.42; --gridop:.35; --shadow:rgba(0,0,0,.55); --blur:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 var(--fb);overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .4s}
a{color:inherit;text-decoration:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Fondo */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg .gr{position:absolute;inset:0;opacity:var(--gridop);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;
  mask-image:radial-gradient(ellipse 70% 55% at 50% 20%,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 20%,#000 30%,transparent 75%)}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:var(--blob);will-change:transform}
.b1{width:520px;height:520px;background:var(--c1);top:-180px;left:-120px;animation:f1 22s ease-in-out infinite}
.b2{width:420px;height:420px;background:var(--c2);top:30%;right:-160px;opacity:calc(var(--blob)*.62);animation:f2 26s ease-in-out infinite}
.b3{width:380px;height:380px;background:var(--c3);bottom:-160px;left:20%;opacity:calc(var(--blob)*.48);animation:f3 30s ease-in-out infinite}
.b4{width:300px;height:300px;background:var(--c4);top:12%;left:55%;opacity:calc(var(--blob)*.6);animation:f2 20s ease-in-out infinite reverse}
@keyframes f1{50%{transform:translate(80px,60px) scale(1.1)}}
@keyframes f2{50%{transform:translate(-70px,50px) scale(.92)}}
@keyframes f3{50%{transform:translate(60px,-70px) scale(1.08)}}
.noglow .blob,.nogrid .gr{display:none}

/* Layout */
.wrap{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:28px 20px 56px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:44px;min-height:42px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 10px;border:1px solid var(--line);border-radius:99px;background:var(--card);font-size:13.5px;color:var(--ink2);backdrop-filter:blur(10px)}
.chip:empty{visibility:hidden}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c2);box-shadow:0 0 0 4px color-mix(in srgb,var(--c2) 22%,transparent)}
.iconbtn{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:.2s;backdrop-filter:blur(10px)}
.iconbtn:hover{background:var(--card-h);transform:translateY(-1px)}
.iconbtn:focus-visible,.card:focus-visible,.feat:focus-visible,.soc a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* Encabezado */
.hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;margin-bottom:40px}
.logo{width:104px;height:104px;border-radius:calc(var(--r) + 8px);background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 20px 50px -12px var(--shadow),0 0 0 6px var(--line)}
.logo img{width:78%;height:78%;object-fit:contain}
.mono{position:relative;font:700 36px/1 Sora,sans-serif;color:#013D70;letter-spacing:-1px}
.mono i{position:absolute;width:9px;height:9px;border-radius:2px;right:-14px}
.kicker{font:600 12.5px/1 var(--fh);letter-spacing:.16em;text-transform:uppercase;color:color-mix(in srgb,var(--accent) 70%,var(--ink));margin-bottom:12px}
h1{font:700 clamp(32px,5.4vw,52px)/1.06 var(--fh);letter-spacing:-.022em}
h1 span{background:linear-gradient(100deg,var(--ink) 25%,color-mix(in srgb,var(--accent) 60%,var(--ink)) 62%,color-mix(in srgb,var(--c2) 60%,var(--ink)));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:12px;color:var(--ink2);font-size:16.5px;max-width:580px}
.bar{display:flex;height:4px;width:120px;border-radius:4px;overflow:hidden;margin-top:18px}
.bar i{flex:1}

/* Destacado */
.feat{position:relative;display:flex;align-items:center;gap:20px;padding:24px 26px;border-radius:calc(var(--r) + 4px);margin-bottom:44px;overflow:hidden;color:var(--onacc);
  background:linear-gradient(120deg,var(--accent),var(--acc2));
  box-shadow:0 30px 60px -25px color-mix(in srgb,var(--accent) 80%,transparent);transition:transform .25s,box-shadow .25s}
.feat::after{content:"";position:absolute;right:-60px;top:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 65%);pointer-events:none}
.feat:hover{transform:translateY(-3px)}
.feat .ic{width:58px;height:58px;border-radius:18px;background:color-mix(in srgb,var(--onacc) 17%,transparent);display:grid;place-items:center;flex:none}
.feat .t{font:600 20px/1.25 var(--fh)}
.feat .d{color:color-mix(in srgb,var(--onacc) 85%,transparent);font-size:15px;margin-top:3px}
.feat .lbl{font:600 11.5px/1 var(--fh);letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--onacc) 78%,transparent);margin-bottom:8px}
.feat .go{margin-left:auto;width:46px;height:46px;border-radius:50%;background:var(--onacc);color:var(--accent);display:grid;place-items:center;flex:none;transition:transform .25s}
.feat:hover .go{transform:rotate(-45deg)}

/* Secciones */
.sec{margin-bottom:38px}
.sec-h{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sec-h i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.sec-h h2{font:600 13px/1 var(--fh);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.sec-h hr{flex:1;border:0;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.list .grid{grid-template-columns:1fr;gap:10px}
.card{position:relative;display:flex;gap:16px;align-items:flex-start;padding:20px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);
  backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));transition:background .25s,border-color .25s,transform .25s,box-shadow .25s;overflow:hidden}
.list .card{align-items:center;padding:16px 18px}
.list .card .u{display:none}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(400px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--c) 20%,transparent),transparent 45%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover{background:var(--card-h);border-color:color-mix(in srgb,var(--c) 55%,transparent);transform:translateY(-3px);box-shadow:0 22px 40px -22px color-mix(in srgb,var(--c) 70%,transparent)}
.card:hover::before{opacity:1}
.card .ic{position:relative;width:48px;height:48px;border-radius:calc(var(--r)*.68);display:grid;place-items:center;flex:none;color:var(--on);
  background:linear-gradient(140deg,var(--c),var(--cd));box-shadow:0 10px 22px -10px var(--c)}
.card .tx{position:relative;min-width:0;flex:1}
.card .t{font:600 16.5px/1.3 var(--fh)}
.card .d{color:var(--ink2);font-size:14.5px;margin-top:4px}
.card .u{color:var(--ink3);font-size:12.5px;margin-top:10px}
.card .ar{position:relative;color:var(--ink3);transition:.25s;flex:none;margin-top:2px}
.card:hover .ar{color:var(--ink);transform:translate(2px,-2px)}

/* Destacado dentro de la sección: ocupa todo el ancho, en su lugar */
.card.hl{grid-column:1/-1;padding:24px;align-items:center;
  background:linear-gradient(115deg,color-mix(in srgb,var(--c) 26%,var(--card)),color-mix(in srgb,var(--c) 8%,var(--card)) 70%);
  border-color:color-mix(in srgb,var(--c) 45%,transparent);box-shadow:0 18px 40px -26px color-mix(in srgb,var(--c) 80%,transparent)}
.card.hl::after{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.card.hl:hover{background:linear-gradient(115deg,color-mix(in srgb,var(--c) 32%,var(--card-h)),color-mix(in srgb,var(--c) 12%,var(--card-h)) 70%)}
.card.hl .ic{width:56px;height:56px}
.card.hl .t{font-size:18.5px}
.card.hl .d{font-size:15px}
.card .pill{display:inline-flex;align-items:center;gap:5px;font:600 10.5px/1 var(--fh);letter-spacing:.12em;text-transform:uppercase;
  color:color-mix(in srgb,var(--c) 70%,var(--ink));background:color-mix(in srgb,var(--c) 18%,transparent);padding:5px 8px;border-radius:99px;margin-bottom:8px}
.card .pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.card.hl .ar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--on);margin-top:0}
.card.hl:hover .ar{color:var(--on);transform:rotate(-45deg)}

/* Vista previa del destino al pasar el mouse */
.pvw{position:fixed;left:0;top:0;z-index:30;pointer-events:none;will-change:transform}
.pvt{width:340px;border-radius:18px;overflow:hidden;background:var(--tile);border:1px solid var(--line);
  box-shadow:0 34px 70px -24px rgba(6,10,40,.55),0 10px 24px -14px rgba(6,10,40,.35);
  opacity:0;transform:scale(.92) translateY(6px);transform-origin:var(--ox,0) var(--oy,0);transition:opacity .18s ease,transform .22s cubic-bezier(.2,.8,.2,1)}
.pvw.on .pvt{opacity:1;transform:none}
.pvt .pb{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line);font:500 12.5px/1.2 var(--fb);color:var(--ink2)}
.pvt .pb i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:var(--pon);background:var(--pc);flex:none}
.pvt .pb span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pvt .pb b{font-weight:600;color:var(--pc);font-size:11.5px;letter-spacing:.02em;flex:none}
.pvt .ps{position:relative;margin:8px;border-radius:12px;overflow:hidden;aspect-ratio:16/10;background:color-mix(in srgb,var(--pc) 10%,var(--tile))}
.pvt .ps img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;opacity:0;transition:opacity .25s}
.pvt.ok .ps img{opacity:1}
.pvt .sk{position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,color-mix(in srgb,var(--ink) 8%,transparent) 50%,transparent 70%);background-size:220% 100%;animation:sk 1.3s linear infinite}
.pvt.ok .sk,.pvt.err .sk{display:none}
@keyframes sk{from{background-position:120% 0}to{background-position:-120% 0}}
.pvt .pf{position:absolute;inset:0;display:none;place-items:center;align-content:center;gap:10px;text-align:center;color:var(--pc);font:600 13px/1.3 var(--fh);padding:16px;
  background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--pc) 22%,transparent),transparent 60%)}
.pvt .pf .big{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;color:var(--pon);background:linear-gradient(140deg,var(--pc),var(--pcd))}
.pvt .pf small{display:block;color:var(--ink3);font:500 12px/1.3 var(--fb)}
.pvt.err .pf{display:grid}
.pvt .wt{position:absolute;left:10px;bottom:10px;font:500 11.5px/1 var(--fb);color:var(--ink2);background:var(--tile);padding:6px 9px;border-radius:99px;display:none}
.pvt.wait .wt{display:block}

/* Celular: captura dentro de los destacados */
.card.thumb{flex-wrap:wrap;row-gap:14px}
.card.thumb .ic{display:none}
.card .th,.feat .th{position:relative;flex:0 0 100%;order:-1;aspect-ratio:2/1;border-radius:calc(var(--r)*.7);overflow:hidden;margin-bottom:2px;
  background:color-mix(in srgb,var(--c) 12%,var(--card));box-shadow:inset 0 0 0 1px var(--line)}
.card .th img,.feat .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;opacity:0;transition:opacity .3s}
.card .th.ok img,.feat .th.ok img{opacity:1}
.card .th .sk,.feat .th .sk{position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,color-mix(in srgb,var(--ink) 8%,transparent) 50%,transparent 70%);background-size:220% 100%;animation:sk 1.3s linear infinite}
.card .th.ok .sk,.feat .th.ok .sk{display:none}
.feat.thumb{flex-wrap:wrap;row-gap:16px}
.feat.thumb .ic{display:none}
.feat.thumb > div{flex:1;min-width:0}
.feat .th{z-index:1;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 16px 30px -18px rgba(0,0,0,.5)}

/* Celular: mantener apretado un enlace abre una vista previa desde abajo */
.touch .card,.touch .feat{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.card.pressing,.feat.pressing{transform:scale(.975);transition:transform .35s ease}
.shbd{position:fixed;inset:0;z-index:40;background:rgba(6,10,40,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet{position:fixed;left:12px;right:12px;bottom:12px;z-index:41;max-width:480px;margin:0 auto;border-radius:24px;background:var(--tile);border:1px solid var(--line);
  padding:8px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -10px 50px -12px rgba(6,10,40,.5);
  transform:translateY(calc(100% + 24px));transition:transform .32s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet-on .shbd{opacity:1;pointer-events:auto}
.sheet-on .sheet{transform:none;visibility:visible}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.pvt.in{width:auto;opacity:1;transform:none;box-shadow:none;border:0;background:transparent;border-radius:0}
.pvt.in .pb{padding:2px 2px 10px;border:0}
.pvt.in .ps{margin:0}
.sheet .st{font:600 17px/1.3 var(--fh);margin:14px 2px 4px;color:var(--ink)}
.sheet .sd{color:var(--ink2);font-size:14.5px;margin:0 2px}
.sheet .sa{display:flex;gap:10px;margin-top:16px}
.sheet .sgo{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:14px;background:var(--pc);color:var(--pon);font:600 15.5px/1 var(--fh)}
.sheet .scl{height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 15px/1 var(--fb);cursor:pointer}
html.lock{overflow:hidden}
footer{margin-top:56px;padding-top:28px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;color:var(--ink3);font-size:13.5px}
.soc{display:flex;gap:10px}
.soc a{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);color:var(--ink2);transition:.2s}
.soc a:hover{color:var(--ink);background:var(--card-h)}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;transition:.3s;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}

.rv{opacity:0;transform:translateY(14px);animation:in .6s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i,0)*55ms + 60ms)}
@keyframes in{to{opacity:1;transform:none}}
.still .rv{animation:none;opacity:1;transform:none}
.still .blob{animation:none}

@media (max-width:680px){
  .wrap{padding:20px 16px 40px}.top{margin-bottom:32px}
  .hero{grid-template-columns:1fr;gap:18px}
  .logo{width:84px;height:84px}
  .grid{grid-template-columns:1fr}
  .feat{padding:20px;gap:16px}.feat .ic{width:50px;height:50px}.feat .t{font-size:17.5px}.feat .go{width:40px;height:40px}
}
@media (prefers-reduced-motion:reduce){.blob,.rv{animation:none}.rv{opacity:1;transform:none}.card,.feat{transition:none}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="gr"></div><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div></div>

<div class="wrap" id="app">
  <div class="top rv">
    <span class="chip" id="handlechip"></span>
    <button class="iconbtn" id="share" aria-label="Compartir esta página">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7.5 7.5 12 3l4.5 4.5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
    </button>
  </div>
  <header class="hero">
    <div class="logo rv" id="logo" style="--i:1"></div>
    <div>
      <div class="kicker rv" style="--i:2" id="kicker"></div>
      <h1 class="rv" style="--i:3"><span id="title"></span></h1>
      <p class="sub rv" style="--i:4" id="subtitle"></p>
      <div class="bar rv" style="--i:5"><i style="background:var(--c1)"></i><i style="background:var(--c2)"></i><i style="background:var(--c4)"></i><i style="background:var(--c3)"></i></div>
    </div>
  </header>
  <main id="main"></main>

</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="shbd" id="shbd"></div>

  <div class="grab"></div>

    <div class="pb"><i id="shi"></i><span id="shh"></span></div>
    <div class="ps"><div class="sk"></div><img id="shimg" alt="" referrerpolicy="no-referrer"><div class="pf"><span class="big" id="shbig"></span><span id="shft"></span></div><span class="wt">Generando vista previa…</span></div>
  </div>
  <div class="st" id="sht"></div><div class="sd" id="shd"></div>
  <div class="sa"><a class="sgo" id="sho" target="_blank" rel="noopener">Abrir <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></a><button type="button" class="scl" id="shc">Cerrar</button></div>
</div>
<div class="pvw" id="pvw" aria-hidden="true"><div class="pvt" id="pvt">
  <div class="pb"><i id="pvi"></i><span id="pvh"></span><b>Abrir ↗</b></div>
  <div class="ps"><div class="sk"></div><img id="pvimg" alt="" referrerpolicy="no-referrer"><div class="pf"><span class="big" id="pvbig"></span><span id="pvft"></span></div><span class="wt">Generando vista previa…</span></div>
</div></div>

<script src="assets/core.js"></script>
<script src="assets/enlaces.js"></script>
<script>
(function(){
  var IC = window.MPBA_ICON, Q = new URLSearchParams(location.search);
  var PREVIEW = Q.has('preview'), first = true;
  var ARROW = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>';
  function $(id){return document.getElementById(id)}
  function el(t,c,txt){var e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e}
  function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return ''}}
  function safe(u){return /^(https?:|mailto:|tel:)/i.test(u||'')?u:'#'}
  function safeImg(u){return /^(https:\/\/|uploads\/|assets\/|data:image\/(png|jpeg|webp);base64,)/i.test(u||'')?u:''}

  /* Tono más profundo de un color, para degradados (el celeste se profundiza hacia el azul institucional) */
  function deep(c){ return window.MPBA_ON(c) === '#FFFFFF' ? 'color-mix(in srgb,' + c + ' 62%,#000)' : 'color-mix(in srgb,' + c + ' 80%,#013D70)'; }
  function applyTheme(T){
    var r = document.documentElement.style, dark = T.mode !== 'light';
    var f = window.MPBA_FONTS[T.font] || window.MPBA_FONTS.moderna;
    var set = {
      '--bg': T.bg, '--accent': T.accent, '--r': (+T.radius||22) + 'px',
      '--c1': T.palette.blue, '--c2': T.palette.green, '--c3': T.palette.red, '--c4': T.palette.sky,
      '--fh': '"' + f.h + '",system-ui,sans-serif', '--fb': '"' + f.b + '",system-ui,sans-serif',
      '--ink': dark ? '#f3f6ff' : '#013D70',
      '--ink2': dark ? 'rgba(235,240,255,.74)' : '#3e5a78',
      '--ink3': dark ? 'rgba(235,240,255,.5)' : '#6c8299',
      '--line': dark ? 'rgba(255,255,255,.10)' : 'rgba(1,61,112,.12)',
      '--shadow': dark ? 'rgba(0,0,0,.55)' : 'rgba(1,61,112,.2)',
      '--onacc': window.MPBA_ON(T.accent), '--acc2': deep(T.accent),
      '--blob': dark ? '.42' : '.2', '--gridop': dark ? '.35' : '.6',
      '--blur': T.cards === 'glass' ? '14px' : '0px',
      '--tile': dark ? 'color-mix(in srgb,' + T.bg + ' 86%,#fff)' : '#ffffff'
    };
    PV_ON = T.preview !== false;
    var card = {
      glass:   dark ? ['rgba(255,255,255,.055)','rgba(255,255,255,.09)'] : ['rgba(255,255,255,.62)','rgba(255,255,255,.9)'],
      solid:   dark ? ['color-mix(in srgb,' + T.bg + ' 88%,#fff)','color-mix(in srgb,' + T.bg + ' 80%,#fff)'] : ['#ffffff','#ffffff'],
      outline: ['transparent', dark ? 'rgba(255,255,255,.05)' : 'rgba(18,26,69,.03)']
    }[T.cards] || null;
    if (card) { set['--card'] = card[0]; set['--card-h'] = card[1]; }
    for (var k in set) r.setProperty(k, set[k]);
    var b = document.body.classList;
    b.toggle('noglow', !T.glow); b.toggle('nogrid', !T.grid); b.toggle('list', T.layout === 'list');
    b.toggle('still', !T.motion || !first);
    var m = document.querySelector('meta[name=theme-color]'); if (m) m.content = T.bg;
  }

  function render(D){
    var P = D.profile || {}, T = window.MPBA_THEME(D.theme), pal = T.palette;
    applyTheme(T);
    var hc = $('handlechip'); hc.innerHTML = '';
    if (P.handle) { hc.appendChild(el('span','dot')); hc.appendChild(el('span',null,P.handle)); }
    $('kicker').textContent = P.kicker || '';
    $('title').textContent = P.title || '';
    $('subtitle').textContent = P.subtitle || '';
    $('copy').textContent = '© ' + new Date().getFullYear() + ' ' + (P.title || '') + ' · Provincia de Buenos Aires';
    if (P.title) document.title = P.title + ' · Enlaces oficiales';

    var lg = $('logo'); lg.innerHTML = '';
    var src = safeImg(P.logo);
    if (src) { var im = new Image(); im.alt = 'Logo ' + (P.title||''); im.src = src; lg.appendChild(im); }
    else lg.innerHTML = '<div class="mono" aria-label="MP">MP<i style="background:var(--c2);top:-6px"></i><i style="background:var(--c1);top:5px"></i><i style="background:var(--c3);top:16px"></i></div>';

    lastD = D; THUMBS = PV_ON_OF(T) && (!CAN_HOVER || (PREVIEW && innerWidth <= 680));
    var main = $('main'), n = 6, featDone = false; main.innerHTML = ''; links = []; close(); sheetClose();
    (D.sections||[]).forEach(function(s){
      var links = (s.links||[]).filter(function(l){return l.visible!==false && l.title && l.url});
      var c = pal[s.color] || pal.blue, rest = [];
      links.forEach(function(l){
        if (l.featured && !featDone) {
          featDone = true;
          var a = el('a','feat rv'); a.href = safe(l.url); a.target = '_blank'; a.rel = 'noopener'; a.style.setProperty('--i', n++);
          a.innerHTML = '<span class="ic">' + IC(l.icon,28) + '</span>';
          var tx = el('div'); tx.appendChild(el('div','lbl','Destacado')); tx.appendChild(el('div','t',l.title)); if (l.desc) tx.appendChild(el('div','d',l.desc));
          a.appendChild(tx); var go = el('span','go'); go.innerHTML = ARROW; a.appendChild(go);
          hover(a, l, T.accent, true);   /* en el celular muestra la captura, como los destacados */
          main.insertBefore(a, main.firstChild); /* el principal siempre encabeza la página */
        } else rest.push(l);
      });
      if (!rest.length) return;
      var sec = el('section','sec'); sec.style.setProperty('--c', c); sec.style.setProperty('--on', window.MPBA_ON(c)); sec.style.setProperty('--cd', deep(c));
      var h = el('div','sec-h rv'); h.style.setProperty('--i', n++);
      h.appendChild(el('i')); h.appendChild(el('h2',null,s.title)); h.appendChild(el('hr')); sec.appendChild(h);
      var g = el('div','grid');
      rest.forEach(function(l){
        var a = el('a','card rv' + (l.highlight ? ' hl' : '')); a.href = safe(l.url); a.target = '_blank'; a.rel = 'noopener'; a.style.setProperty('--i', n++);
        a.innerHTML = '<span class="ic">' + IC(l.icon, l.highlight ? 27 : 24) + '</span>';
        var tx = el('div','tx'); if (l.highlight) tx.appendChild(el('span','pill','Destacado')); tx.appendChild(el('div','t',l.title)); if (l.desc) tx.appendChild(el('div','d',l.desc));
        var hu = host(l.url); if (hu) tx.appendChild(el('div','u',hu));
        a.appendChild(tx); var ar = el('span','ar'); ar.innerHTML = ARROW; a.appendChild(ar);
        a.addEventListener('pointermove', function(e){var r=a.getBoundingClientRect();a.style.setProperty('--mx',(e.clientX-r.left)+'px');a.style.setProperty('--my',(e.clientY-r.top)+'px')});
        hover(a, l, c, !!l.highlight);
        g.appendChild(a);
      });
      sec.appendChild(g); main.appendChild(sec);
    });

    var soc = $('soc'); soc.innerHTML = '';
    (D.social||[]).forEach(function(s){
      if (!s.url || s.url === 'https://') return;
      var a = el('a'); a.href = safe(s.url); a.target = '_blank'; a.rel = 'noopener';
      a.setAttribute('aria-label', (window.MPBA_ICONS[s.type]||{}).label || 'Red social');
      a.innerHTML = IC(s.type,19); soc.appendChild(a);
    });
    first = false;
    warmAll();
  }

  /* ---------- Vista previa del destino al pasar el mouse ----------
     Captura automática del sitio (servicio público mShots de WordPress.com).
     Solo en dispositivos con mouse; en celulares no hay "pasar el mouse". */
  var PV_ON = true, PV_W = 640;
  var CAN_HOVER = !!(window.matchMedia && matchMedia('(hover:hover) and (pointer:fine)').matches);
  var THUMBS = false, lastD = null;
  function PV_ON_OF(T){ return T.preview !== false; }
  if (!CAN_HOVER) document.documentElement.classList.add('touch');
  /* Avisa a quien espera una captura (miniaturas y hoja del celular) cuando terminó de cargar */
  function done(s){ if (s.state !== 'wait' && s.subs) { var q = s.subs; s.subs = null; q.forEach(function(f){ f(s); }); } paint(); sheetPaint(); }
  function track(l, cb){ var s = stateFor(l); if (s.state !== 'wait') cb(s); else (s.subs = s.subs || []).push(cb); return s; }
  var shots = {}, links = [], pvCur = null, pvTimer = 0, mx = 0, my = 0, raf = 0;
  var pvw = $('pvw'), pvt = $('pvt'), pvimg = $('pvimg');
  function shotSrc(u, n){ return 'https://s.wordpress.com/mshots/v1/' + encodeURIComponent(u) + '?w=' + PV_W + '&h=400' + (n ? '&r=' + n : ''); }
  function shot(u){
    var s = shots[u] || (shots[u] = {state:'wait', tries:0, busy:false, timer:0});
    if (s.state !== 'wait' || s.busy || s.timer) return s;   /* ya hay un pedido en curso o programado */
    s.busy = true;
    var im = new Image(); im.referrerPolicy = 'no-referrer';
    im.onload = function(){
      s.busy = false;
      if (im.naturalWidth === PV_W) { s.state = 'ok'; s.src = im.src; }
      else if (++s.tries <= 6) s.timer = setTimeout(function(){ s.timer = 0; shot(u); }, 2500);   /* el servicio todavía la está generando */
      else s.state = 'err';
      done(s);
    };
    im.onerror = function(){ s.busy = false; s.state = 'err'; done(s); };
    im.src = shotSrc(u, s.tries);
    return s;
  }
  function isWeb(u){ return /^https?:\/\//i.test(u || ''); }
  /* Imagen propia cargada desde el panel (reemplaza la captura automática) */
  function ownImg(p){ return /^(assets\/previews\/|uploads\/)[\w.-]+\.(jpe?g|png|webp)$/i.test(p || '') || /^data:image\/(jpeg|png|webp);base64,/.test(p || ''); }
  function custom(src){
    var k = 'c:' + src, s = shots[k];
    if (s) return s;
    s = shots[k] = {state:'wait', tries:0};
    var im = new Image();
    im.onload = function(){ s.state = 'ok'; s.src = src; done(s); };
    im.onerror = function(){ s.state = 'err'; done(s); };
    im.src = src;
    return s;
  }
  /* none = sin vista previa · ruta = imagen propia · vacío = captura automática */
  function stateFor(l){
    if (l.preview === 'none') return {state:'err'};
    if (ownImg(l.preview)) return custom(l.preview);
    return isWeb(l.url) ? shot(l.url) : {state:'err'};
  }
  function hover(a, l, color, hl){
    if (THUMBS && hl) thumb(a, l);
    if (!CAN_HOVER) { if (!hl) press(a, l, color); return; }
    links.push(l);
    a.addEventListener('mouseenter', function(e){
      if (!PV_ON) return;
      mx = e.clientX; my = e.clientY;
      clearTimeout(pvTimer);
      pvTimer = setTimeout(function(){ pvOpen(l, color); }, 180);
    });
    a.addEventListener('mousemove', function(e){ mx = e.clientX; my = e.clientY; if (pvCur) place(); });
    a.addEventListener('mouseleave', close);
    a.addEventListener('click', close);
  }
  function pvOpen(l, color){
    pvCur = l;
    pvt.style.setProperty('--pc', color); pvt.style.setProperty('--pon', window.MPBA_ON(color)); pvt.style.setProperty('--pcd', deep(color));
    $('pvi').innerHTML = IC(l.icon, 14);
    $('pvh').textContent = host(l.url) || l.url.replace(/^(mailto|tel):/i, '');
    $('pvbig').innerHTML = IC(l.icon, 28);
    $('pvft').innerHTML = ''; var t = el('span', null, l.title); $('pvft').appendChild(t);
    $('pvft').appendChild(el('small', null, !isWeb(l.url) ? (/^mailto:/i.test(l.url) ? 'Enviar un correo' : 'Llamar') : (l.preview === 'none' ? (host(l.url) || '') : 'Vista previa no disponible')));
    paint(); place();
    pvw.classList.add('on');
  }
  function paint(){
    if (!pvCur) return;
    var s = stateFor(pvCur);
    pvt.classList.toggle('ok', s.state === 'ok');
    pvt.classList.toggle('err', s.state === 'err');
    pvt.classList.toggle('wait', s.state === 'wait' && s.tries > 0);
    if (s.state === 'ok') { if (pvimg.getAttribute('src') !== s.src) pvimg.src = s.src; }
    else pvimg.removeAttribute('src');
  }
  function place(){
    if (raf) return;
    raf = requestAnimationFrame(function(){
      raf = 0;
      var w = pvt.offsetWidth, h = pvt.offsetHeight, vw = innerWidth, vh = innerHeight, gap = 22;
      var right = mx + gap + w <= vw - 12, below = my + gap + h <= vh - 12;
      var x = right ? mx + gap : Math.max(12, mx - gap - w);
      var y = below ? my + gap : Math.max(12, my - gap - h);
      pvt.style.setProperty('--ox', right ? '0' : '100%'); pvt.style.setProperty('--oy', below ? '0' : '100%');
      pvw.style.transform = 'translate3d(' + Math.round(x) + 'px,' + Math.round(y) + 'px,0)';
    });
  }
  function close(){ clearTimeout(pvTimer); pvCur = null; pvw.classList.remove('on'); }

  /* Destacados en el celular: la captura va dentro de la tarjeta */
  function thumb(a, l){
    if (l.preview === 'none' || (!isWeb(l.url) && !ownImg(l.preview))) return;
    var th = el('span', 'th'), im = el('img'); im.alt = ''; im.referrerPolicy = 'no-referrer';
    th.appendChild(el('span', 'sk')); th.appendChild(im);
    a.classList.add('thumb'); a.insertBefore(th, a.firstChild);
    track(l, function(s){
      if (s.state === 'ok') { im.src = s.src; th.classList.add('ok'); }
      else { th.remove(); a.classList.remove('thumb'); }
    });
  }

  /* Enlaces comunes en el celular: mantener apretado abre la vista previa */
  var held = false, shCur = null;
  var sheet = $('sheet'), shv = $('shv'), shimg = $('shimg');
  function press(a, l, color){
    var t = 0, p = 0, sx = 0, sy = 0;
    function stop(){ clearTimeout(t); clearTimeout(p); a.classList.remove('pressing'); }
    a.addEventListener('touchstart', function(e){
      if (!PV_ON) return;
      var q = e.touches[0]; sx = q.clientX; sy = q.clientY; held = false; stop();
      p = setTimeout(function(){ a.classList.add('pressing'); }, 120);
      t = setTimeout(function(){
        held = true; a.classList.remove('pressing');
        try { if (navigator.vibrate) navigator.vibrate(10); } catch(x) {}
        sheetOpen(l, color);
      }, 450);
    }, {passive:true});
    a.addEventListener('touchmove', function(e){ var q = e.touches[0]; if (Math.abs(q.clientX - sx) > 10 || Math.abs(q.clientY - sy) > 10) stop(); }, {passive:true});
    a.addEventListener('touchend', function(e){ stop(); if (held) e.preventDefault(); });
    a.addEventListener('touchcancel', stop);
    a.addEventListener('click', function(e){ if (held) { e.preventDefault(); held = false; } });
    a.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  }
  function sheetOpen(l, color){
    shCur = l;
    [sheet, shv].forEach(function(x){ x.style.setProperty('--pc', color); x.style.setProperty('--pon', window.MPBA_ON(color)); x.style.setProperty('--pcd', deep(color)); });
    $('shi').innerHTML = IC(l.icon, 14);
    $('shh').textContent = host(l.url) || l.url.replace(/^(mailto|tel):/i, '');
    $('shbig').innerHTML = IC(l.icon, 28);
    $('shft').innerHTML = ''; $('shft').appendChild(el('span', null, l.title));
    $('shft').appendChild(el('small', null, !isWeb(l.url) ? (/^mailto:/i.test(l.url) ? 'Enviar un correo' : 'Llamar') : (l.preview === 'none' ? (host(l.url) || '') : 'Vista previa no disponible')));
    $('sht').textContent = l.title; $('shd').textContent = l.desc || '';
    var go = $('sho'); go.href = safe(l.url);
    sheetPaint();
    document.documentElement.classList.add('sheet-on', 'lock');
    setTimeout(function(){ go.focus({preventScroll:true}); }, 50);
  }
  function sheetPaint(){
    if (!shCur) return;
    var s = stateFor(shCur);
    shv.classList.toggle('ok', s.state === 'ok');
    shv.classList.toggle('err', s.state === 'err');
    shv.classList.toggle('wait', s.state === 'wait');
    if (s.state === 'ok') { if (shimg.getAttribute('src') !== s.src) shimg.src = s.src; }
    else shimg.removeAttribute('src');
  }
  function sheetClose(){ if (!shCur) return; shCur = null; document.documentElement.classList.remove('sheet-on', 'lock'); }
  $('shbd').addEventListener('click', sheetClose);
  $('shc').addEventListener('click', sheetClose);
  $('sho').addEventListener('click', function(){ setTimeout(sheetClose, 150); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') sheetClose(); });
  /* En la vista previa del panel, al cambiar entre celular y escritorio se vuelve a armar */
  if (PREVIEW) { var rz = 0; window.addEventListener('resize', function(){ clearTimeout(rz); rz = setTimeout(function(){ if (lastD) render(lastD); }, 150); }); }
  window.addEventListener('scroll', close, {passive:true});
  window.addEventListener('blur', close);
  /* Pide las capturas en segundo plano para que al pasar el mouse ya estén listas */
  function warmAll(){
    if (!CAN_HOVER || !PV_ON) return;
    var go = function(){ links.forEach(function(l){ stateFor(l); }); };
    if (window.requestIdleCallback) requestIdleCallback(go, {timeout:2500}); else setTimeout(go, 1200);
  }

  /* Datos publicados (se pide siempre la versión vigente, sin quedar atrapados en caché) */
  function boot(){ render(window.MPBA_DATA || {profile:{},sections:[],social:[]}); }
  if (PREVIEW) boot();
  else {
    var sc = document.createElement('script');
    sc.src = 'assets/enlaces.js?v=' + Math.floor(Date.now() / 20000);
    sc.onload = boot; sc.onerror = boot;
    document.body.appendChild(sc);
  }

  /* Vista previa en vivo desde el panel */
  if (PREVIEW) {
    window.addEventListener('message', function(e){
      if (e.origin !== location.origin || !e.data || e.data.type !== 'mpba-preview') return;
      render(e.data.data);
    });
    if (window.parent !== window) window.parent.postMessage({type:'mpba-preview-ready'}, location.origin === 'null' ? '*' : location.origin);
    document.addEventListener('click', function(e){ var a = e.target.closest('a'); if (a) { e.preventDefault(); } }, true);
  }

  var toast = $('toast');
  function say(m){toast.textContent=m;toast.classList.add('on');clearTimeout(say.t);say.t=setTimeout(function(){toast.classList.remove('on')},2200)}
  $('share').addEventListener('click', function(){
    var url = location.href.split('?')[0];
    if (navigator.share) { navigator.share({title:document.title, url:url}).catch(function(){}); return; }
    try { navigator.clipboard.writeText(url).then(function(){say('Enlace copiado')}, function(){say(url)}); } catch(e){ say(url); }
  });
})();
</script>
